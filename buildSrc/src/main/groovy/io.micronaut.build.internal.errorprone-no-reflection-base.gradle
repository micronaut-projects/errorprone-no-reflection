repositories {
    // the ErrorProne Gradle plugin is published to the Gradle Plugin Portal, not to Maven Central. It is declared here,
    // before the Micronaut conventions apply java-library, because the binary compatibility check copies the repositories
    // of a project at that moment to resolve the previous release, whose dependencies include the ErrorProne plugin
    gradlePluginPortal {
        content {
            includeGroup 'net.ltgt.errorprone'
            includeGroup 'net.ltgt.gradle'
        }
    }
}
